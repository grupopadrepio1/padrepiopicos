  <script>
    (function () {
      if (window.location.pathname.endsWith('/index.html')) {
        const cleanPath = window.location.pathname.replace(/index\.html$/, '');
        window.history.replaceState(null, '', cleanPath + window.location.search + window.location.hash);
      }

      try {
        const s = localStorage.getItem('theme');
        if (s === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        else if (!s && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) { }
    })();
  </script>

  <script>
    function initializeApp() {

      /* =========================
         SPA Navigation
      ========================== */
      const sections = document.querySelectorAll('[data-page]');
      const navLinks = document.querySelectorAll('[data-page-link]');
      const mobileMenu = document.getElementById('mobile-menu');

      function showPage(page) {
        sections.forEach(section => {
          section.classList.toggle('active', section.dataset.page === page);
        });

        navLinks.forEach(link => {
          link.classList.toggle(
            'text-emerald-600',
            link.dataset.pageLink === page
          );
        });

        if (mobileMenu && !mobileMenu.classList.contains('hidden')) {
          mobileMenu.classList.add('hidden');
        }
      }

      navLinks.forEach(link => {
        link.addEventListener('click', () =>
          showPage(link.dataset.pageLink)
        );
      });

      document.querySelectorAll('[data-jump]').forEach(btn => {
        btn.addEventListener('click', () =>
          showPage(btn.dataset.jump)
        );
      });

      /* =========================
         Mobile Menu
      ========================== */
      const mobileToggle = document.getElementById('mobile-toggle');
      if (mobileToggle && mobileMenu) {
        mobileToggle.addEventListener('click', () => {
          mobileMenu.classList.toggle('hidden');
        });
      }

      /* =========================
         Slider (Hero)
      ========================== */
      const slides = document.querySelectorAll('.hero-slide');
      if (slides.length > 0) {
        let currentSlide = 0;
        const overlay1 = document.getElementById('hero-overlay-1');
        const overlay2 = document.getElementById('hero-overlay-2');

        const nextSlide = () => {
          slides[currentSlide].classList.remove('active');
          currentSlide = (currentSlide + 1) % slides.length;
          slides[currentSlide].classList.add('active');
          // updateOverlays(currentSlide); // Removido

          // Tempo: 10s se estiver no slide 0 (foto1), senão 5s
          const duration = currentSlide === 0 ? 10000 : 5000;
          setTimeout(nextSlide, duration);
        };

        // Iniciar loop com duração inicial de 10s (já que começa no slide 0)
        setTimeout(nextSlide, 10000);
      }
    }

    /* =========================
       Carregamento dos Includes
    ========================== */
    document.addEventListener('DOMContentLoaded', () => {
      Promise.all([
        fetch('includes/header.html').then(r => r.text()),
        fetch('includes/footer.html').then(r => r.text()),
        fetch('includes/lightbox.html').then(r => r.text()),
        fetch('pages/inicio.html').then(r => r.text()),
        fetch('pages/agenda26.html').then(r => r.text()),
        // fetch('pages/catequese.html').then(r => r.text()),
        fetch('pages/galeria.html').then(r => r.text()),
        fetch('pages/webradio.html').then(r => r.text()),
        fetch('pages/sobre.html').then(r => r.text())
      ])
        .then(([
          headerData,
          footerData,
          lightboxData,
          inicioData,
          agenda26Data,
          // catequeseData,
          galeriaData,
          webradioData,
          sobreData
        ]) => {

          document.getElementById('header-container').innerHTML = headerData;
          document.getElementById('footer-container').innerHTML = footerData;
          document.getElementById('lightbox-container').innerHTML = lightboxData;

          document.getElementById('inicio-content').innerHTML = inicioData;
          document.getElementById('agenda26-content').innerHTML = agenda26Data;
          // document.getElementById('catequese-content').innerHTML = catequeseData;
          document.getElementById('galeria-content').innerHTML = galeriaData;
          document.getElementById('webradio-content').innerHTML = webradioData;
          document.getElementById('sobre-content').innerHTML = sobreData;

          initializeApp();
          initGallery();

          /* Ajustes pós-injeção: aplicar loading=lazy em imagens injetadas */
          document.querySelectorAll('#inicio-content img, #catequese-content img, #galeria-content img, #webradio-content img, #sobre-content img')
            .forEach(img => { if (!img.loading) img.loading = 'lazy'; });

          /* 🔊 RÁDIO AO VIVO (depois do footer existir) */
          const radioScript = document.createElement("script");
          radioScript.src = "https://cdn.cloud.caster.fm/widgets/embed.js";
          radioScript.async = true;
          document.body.appendChild(radioScript);

          /* Script da Catequese (modal de encontros) */
          // const cateScript = document.createElement('script');
          // cateScript.src = 'assets/js/catequese.js';
          // document.body.appendChild(cateScript);
        })
        .catch(err =>
          console.error('Erro ao carregar componentes:', err)
        );
    });
  </script>
